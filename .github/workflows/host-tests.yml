name: repository-checks
on:
  push:
  pull_request:
jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run RehabMotion host and integration checks
        run: bash scripts/validate_repo.sh
